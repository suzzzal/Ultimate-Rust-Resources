name: Issue Auto Reply

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment:
    if: github.event.issue.pull_request == null  # to skip if it's a PR
    runs-on: ubuntu-latest
    steps:
      - name: Add welcome comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Thank you for raising this issue! Our team will review it soon. 

For more queries or discussions or approval of requests, please join the Discord server for further discussion: [Join Here](https://discord.com/invite/Yn9g6KuWyA)`
            })
